name: Watheqa Fund Prices Auto-Update

on:
  schedule:
    # 06:00 UTC = 08:00 صباحاً بتوقيت القاهرة (UTC+2)
    # أيام الأحد → الخميس (أيام عمل مصر)
    - cron: '0 6 * * 0-4'

  # زر تشغيل يدوي من GitHub
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run - show prices without saving to DB'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      verbose:
        description: 'Verbose logging'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  scrape-and-update:
    name: "Scrape snduk.com → Update Supabase"
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/scraper/requirements.txt

      - name: Install Python Dependencies
        run: pip install -r scripts/scraper/requirements.txt

      - name: Install Playwright Chromium + System Deps
        run: python -m playwright install chromium --with-deps

      - name: Run Fund Price Scraper
        timeout-minutes: 10
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCRAPER_TIMEOUT_MIN: "9"
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
            echo "Mode: DRY-RUN"
          else
            echo "Mode: LIVE (will update Supabase)"
          fi
          if [ "${{ github.event.inputs.verbose }}" = "true" ]; then
            FLAGS="$FLAGS --verbose"
          fi
          python scripts/scraper/snduk_scraper.py $FLAGS

      - name: Upload Debug HTML (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-page-${{ github.run_number }}
          path: |
            scripts/scraper/debug_page.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Scraped JSON (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraped-funds-${{ github.run_number }}
          path: scripts/scraper/scraped_funds.json
          retention-days: 30
          if-no-files-found: ignore
